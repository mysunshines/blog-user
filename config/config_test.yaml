# ============================================================
# user-service 配置（Docker test 环境）
# ------------------------------------------------------------
# 由 docker-compose 注入 APP_ENV=test 时加载（CONFIG_PATH=config/config_test.yaml）。
# 与 development 的差异：基础设施地址全部指向 docker 网络内的服务名
# （mysql / redis / consul / loki / otel-collector 均在 shared-infra 网络）。
# ============================================================

app:
  name: "user-service"
  env: "test"
  log_level: "debug"

grpc:
  host: "0.0.0.0"
  port: 9101

http:
  host: "0.0.0.0"
  port: 8081

database:
  host: "mysql"
  port: 3306
  user: "root"
  password: "root123"    # 与 docker-compose.infra.yml 中 MySQL 初始化口令一致
  name: "blog"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 3600

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

jwt:
  secret: "test-secret-key-do-not-use-in-production"
  expire_time: 604800    # 秒；7 天

consul:
  address: "consul:8500"
  check_interval: 10
  deregister_critical: 30

metrics:
  enabled: true
  path: "/metrics"
  port: 9091

rate_limit:
  enabled: true
  qps: 2000
  burst: 4000

server:
  grpc:
    default_timeout_sec: 10
    max_connection_idle_sec: 60
    max_connection_age_sec: 120
    max_connection_age_grace_sec: 30
    min_ping_interval_sec: 30
    max_concurrent_streams: 100
  http:
    read_timeout_sec: 30
    read_header_timeout_sec: 10
    write_timeout_sec: 30
    idle_timeout_sec: 120
    default_timeout_sec: 30

loki:
  enabled: false
  url: "http://loki:3100/loki/api/v1/push"
  tenant_id: ""

otel:
  enabled: false
  endpoint: "otel-collector:4317"
