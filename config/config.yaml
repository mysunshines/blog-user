app:
  name: "user-service"
  env: "development"
  log_dir: "./logs"
  log_level: "info"

grpc:
  host: "0.0.0.0"
  port: 9101

# HTTP 服务配置（健康检查 / 就绪探针；业务 API 亦经此端口，便于直连调试）
http:
  host: "0.0.0.0"
  port: 8081

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
  name: "user_db"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

jwt:
  secret: "your-secret-key-change-in-production"
  expire_time: 168 # 7 days in hours

consul:
  address: "localhost:8500"
  check_interval: 10
  deregister_critical: 30

metrics:
  enabled: true
  path: "/metrics"
  port: 9091

bloom:
  enabled: true
  size: 1000000

mail:
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  from_address: "noreply@blog.local"
  use_tls: true

# 可观测性（想法 3 · A+B）：默认关闭，配好基础设施后开启。详见 README 第 14.x 节。
loki:
  enabled: false
  url: "http://loki:3100/loki/api/v1/push"
  tenant_id: ""
otel:
  enabled: false
  endpoint: "otel-collector:4317"
