syntax = "proto3";

package user.v1;

option go_package = "github.com/mysunshines/blog-user/proto/pb";

// ============================================================================
// HTTP API Contract (source of truth for user-service HTTP routes)
// ----------------------------------------------------------------------------
// 路径前缀：APIPathPrefix = /api/v1
// 鉴权约定：
//   - "登录"    = 需 JWT (Authorization: Bearer)
//   - "管理员"  = 需 JWT + 管理员角色
//   - "公开"    = 无需鉴权
// 备注：
//   - 下列 HTTP 端点与 gRPC service 分离（未启用 grpc-gateway），
//     HTTP 由 gin 手写注册，gRPC 由 Gateway 代理。
//   - 文件上传（multipart）不适合 gRPC，故 /avatar、/register、/send-code
//     仅以 HTTP 形式存在，proto 的 UserService 不含这些方法。
// ----------------------------------------------------------------------------
// METHOD  PATH                          AUTH        说明                        Go 常量(handler/v1)
// POST    /api/v1/user/register         公开         注册（含 verify_code 字段，proto 无对应）   UserGroup + UserRegisterPath
// POST    /api/v1/user/send-code        公开         发送验证码（proto 无对应方法）            UserGroup + UserSendCodePath
// POST    /api/v1/user/avatar           登录         头像上传（multipart field=file）         UserGroup + UserAvatarPath
// GET     /api/v1/user/uploads/*        公开(静态)   头像图片静态托管                     UserUploadsBaseURL
// GET     /api/v1/admin/user            管理员       用户列表                          UserAdminGroup
// PUT     /api/v1/admin/user/:id        管理员       更新用户                          UserAdminGroup
// DELETE  /api/v1/admin/user/:id        管理员       删除用户                          UserAdminGroup
// GET     /api/v1/admin/user/operation-logs  管理员   操作日志列表                        UserAdminGroup
// ----------------------------------------------------------------------------
// 路径常量统一定义在 internal/handler/v1/routes.go，main.go 与各 handler 均引用，
// 请勿在 proto 注释之外的 Go 代码中硬编码以下路径字符串。
// ============================================================================


// 错误码定义 (区间: 20000-29999)
enum UserErrorCode {
    USER_SUCCESS = 0;
    USER_ALREADY_EXISTS = 20001;
    USER_TOKEN_INVALID = 20002;
    USER_PASSWORD_INCORRECT = 20003;
    USER_IN_BLACKLIST = 20004;
    USER_NOT_FOUND = 20005;
    USER_CREATE_FAILED = 20011;
    USER_UPDATE_FAILED = 20012;
    USER_DELETE_FAILED = 20013;
    USER_LOGIN_FAILED = 20014;
    USER_REGISTER_FAILED = 20015;
}

service UserService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
    rpc AddToBlacklist(BlacklistRequest) returns (BlacklistResponse);
    rpc RemoveFromBlacklist(BlacklistRequest) returns (BlacklistResponse);
    rpc IsInBlacklist(IsBlacklistRequest) returns (IsBlacklistResponse);
    // 操作审计：作为 UserService 的普通 RPC，不再独立成 AuditService
    rpc RecordLog(RecordLogRequest) returns (RecordLogResponse);
    rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
}

message User {
    uint32 id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
    string nickname = 5;
    string avatar = 6;
    string bio = 7;
    uint32 role = 8;
    uint32 status = 9;
    string created_at = 10;
    string updated_at = 11;
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string nickname = 4;
}

message RegisterResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
    string token = 4;
    string csrf_token = 5;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
    string token = 4;
    string csrf_token = 5;
}

message LogoutRequest {
    uint32 user_id = 1;
    string token = 2;
}

message LogoutResponse {
    uint32 code = 1;
    string message = 2;
}

message GetUserRequest {
    uint32 user_id = 1;
    string username = 2;
}

message GetUserResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    uint32 code = 1;
    string message = 2;
    uint32 user_id = 3;
    string username = 4;
    bool valid = 5;
}

message UpdateUserRequest {
    uint32 user_id = 1;
    string nickname = 2;
    string avatar = 3;
    string bio = 4;
}

message UpdateUserResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
}

message DeleteUserRequest {
    uint32 user_id = 1;
}

message DeleteUserResponse {
    uint32 code = 1;
    string message = 2;
}

message GetUsersRequest {
    uint32 page = 1;
    uint32 page_size = 2;
    uint32 role = 3;
}

message GetUsersResponse {
    uint32 code = 1;
    string message = 2;
    repeated User users = 3;
    uint32 total = 4;
}

message ChangePasswordRequest {
    uint32 user_id = 1;
    string old_password = 2;
    string new_password = 3;
}

message ChangePasswordResponse {
    uint32 code = 1;
    string message = 2;
}

message BlacklistRequest {
    uint32 user_id = 1;
    uint32 target_user_id = 2;
    string reason = 3;
}

message BlacklistResponse {
    uint32 code = 1;
    string message = 2;
}

message IsBlacklistRequest {
    uint32 user_id = 1;
    uint32 target_user_id = 2;
}

message IsBlacklistResponse {
    uint32 code = 1;
    string message = 2;
    bool in_blacklist = 3;
}

// ===================== 操作日志 (Audit) =====================

// AuditAction 操作日志动作枚举，作为各服务上报操作日志的统一取值字典。
// 新增动作只需在此追加（proto3 要求首个成员值为 0，且不可为空）。
enum AuditAction {
    AUDIT_ACTION_UNSPECIFIED = 0;
    // 用户域
    AUDIT_ACTION_UPDATE_USER = 1;   // 更新用户资料
    AUDIT_ACTION_DELETE_USER = 2;   // 删除用户
    AUDIT_ACTION_DISABLE_USER = 3;  // 禁用用户
    AUDIT_ACTION_ENABLE_USER = 4;   // 启用用户
    AUDIT_ACTION_SET_ROLE = 5;      // 修改用户角色
    // 评论域
    AUDIT_ACTION_COMMENT_CREATE = 10; // 创建评论
    AUDIT_ACTION_COMMENT_REPLY = 11;  // 回复评论
    AUDIT_ACTION_COMMENT_UPDATE = 12; // 更新评论
    AUDIT_ACTION_COMMENT_DELETE = 13; // 删除评论
    AUDIT_ACTION_COMMENT_LIKE = 14;   // 点赞评论
    AUDIT_ACTION_COMMENT_ENABLE = 15; // 开启文章评论
    AUDIT_ACTION_COMMENT_DISABLE = 16; // 关闭文章评论
    // 文章域
    AUDIT_ACTION_ARTICLE_CREATE = 20;  // 创建文章
    AUDIT_ACTION_ARTICLE_UPDATE = 21;  // 更新文章
    AUDIT_ACTION_ARTICLE_DELETE = 22;  // 删除文章
    AUDIT_ACTION_ARTICLE_PUBLISH = 23; // 发布文章
    AUDIT_ACTION_ARTICLE_OFFLINE = 24; // 下架文章
    AUDIT_ACTION_ARTICLE_APPROVE = 25; // 审核通过
    AUDIT_ACTION_ARTICLE_REJECT = 26;  // 审核拒绝
    AUDIT_ACTION_ARTICLE_SUBMIT = 27;  // 提交审核
    AUDIT_ACTION_ARTICLE_SET_CATEGORY = 28; // 设置文章分类
    // 分类域
    AUDIT_ACTION_CATEGORY_CREATE = 30; // 创建分类
    AUDIT_ACTION_CATEGORY_UPDATE = 31; // 更新分类
    AUDIT_ACTION_CATEGORY_DELETE = 32; // 删除分类
}

message OperationLog {
    uint32 id = 1;
    uint32 operator_id = 2;
    string operator = 3;
    string action = 4;
    string target_type = 5;
    uint32 target_id = 6;
    string target_title = 7;
    string detail = 8;
    string ip = 9;
    string created_at = 10;
}

message RecordLogRequest {
    uint32 operator_id = 1;
    string operator = 2;
    AuditAction action = 3;
    string target_type = 4;
    uint32 target_id = 5;
    string target_title = 6;
    string detail = 7;
    string ip = 8;
}

message RecordLogResponse {
    uint32 code = 1;
    string message = 2;
    uint32 id = 3;
}

message ListLogsRequest {
    uint32 page = 1;
    uint32 page_size = 2;
    string action = 3;
    string target_type = 4;
    uint32 operator_id = 5;
}

message ListLogsResponse {
    uint32 code = 1;
    string message = 2;
    repeated OperationLog logs = 3;
    uint32 total = 4;
}

// AuditService 操作日志服务：由各业务服务通过 gRPC 上报操作记录，
// user-service 作为日志归属方统一落库，并对外提供管理端查询接口。
// 说明：自重构后 RecordLog/ListLogs 已并入 UserService（见上方 service UserService），
// 不再以独立 service 形式存在。

