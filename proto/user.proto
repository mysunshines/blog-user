syntax = "proto3";

package user.v1;

option go_package = "github.com/mysunshines/blog-user/proto/pb";

// ============================================================================
// gRPC Contract (source of truth for user-service)
// ----------------------------------------------------------------------------
// 业务流量一律走 gRPC，由 Gateway 经 /api/v1 反射代理转发：
//   URL 末段 snake_case → PascalCase 即方法名，首段 → service 名。
//   例：/api/v1/user/admin_get_users → UserService.AdminGetUsers
// 鉴权约定：
//   - "登录"    = 需 JWT (Authorization: Bearer)
//   - "管理员"  = 需 JWT + 管理员角色（gRPC 层由 requireGRPCAdmin 校验）
//   - "公开"    = 无需鉴权
// 备注：
//   - HTTP 端口仅承载探针（/health、/ready、/version），不再暴露任何业务路由。
//   - 头像上传（multipart）不适合 gRPC，已上提至 Gateway（/api/v1/user/avatar
//     走 MinIO），不再由 user-service 本地接收。
// ============================================================================


// 错误码定义 (区间: 20000-29999)
enum UserErrorCode {
    USER_SUCCESS = 0;
    // USER_INTERNAL_ERROR 复用 gocommon 通用内部错误码 10005，
    // 供未预期错误 / errors.Internal 兜底映射，与通用码区间对齐。
    USER_INTERNAL_ERROR = 10005;
    USER_ALREADY_EXISTS = 20001;
    USER_TOKEN_INVALID = 20002;
    USER_PASSWORD_INCORRECT = 20003;
    USER_IN_BLACKLIST = 20004;
    USER_NOT_FOUND = 20005;
    USER_TOKEN_EXPIRED = 20006;
    USER_CREATE_FAILED = 20011;
    USER_UPDATE_FAILED = 20012;
    USER_DELETE_FAILED = 20013;
    USER_LOGIN_FAILED = 20014;
    USER_REGISTER_FAILED = 20015;
    USER_UNAUTHORIZED = 20100;
    USER_FORBIDDEN = 20101;
    USER_RESOURCE_NOT_FOUND = 20102;
    USER_TOO_MANY_REQUESTS = 20016;
}

service UserService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    // GenerateCaptcha 生成图形验证码（防机器人/脚本），前端在注册、登录页展示并要求用户输入。
    rpc GenerateCaptcha(GenerateCaptchaRequest) returns (GenerateCaptchaResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
    rpc AddToBlacklist(BlacklistRequest) returns (BlacklistResponse);
    rpc RemoveFromBlacklist(BlacklistRequest) returns (BlacklistResponse);
    rpc IsInBlacklist(IsBlacklistRequest) returns (IsBlacklistResponse);

    // ===================== 后台管理（仅管理员，requireGRPCAdmin） =====================
    rpc AdminGetUsers(AdminGetUsersRequest) returns (AdminGetUsersResponse);
    rpc AdminUpdateUser(AdminUpdateUserRequest) returns (AdminUpdateUserResponse);
    rpc AdminDeleteUser(AdminDeleteUserRequest) returns (DeleteUserResponse);
    rpc ListOperationLogs(ListOperationLogsRequest) returns (ListOperationLogsResponse);

    // ===================== 操作审计（各服务经 gRPC 上报，user-service 落库） =====================
    rpc RecordLog(RecordLogRequest) returns (RecordLogResponse);
}

message User {
    uint32 id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
    string nickname = 5;
    string avatar = 6;
    string bio = 7;
    uint32 role = 8;
    uint32 status = 9;
    string created_at = 10;
    string updated_at = 11;
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string nickname = 4;
    // 图形验证码：GenerateCaptcha 返回后，前端回传 id 与用户输入的 code 用于校验。
    string captcha_id = 5;
    string captcha_code = 6;
}

message RegisterResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
    string token = 4;
    string csrf_token = 5;
}

message LoginRequest {
    string username = 1;
    string password = 2;
    // 图形验证码：登录同样需校验，防撞库/暴力破解机器人。
    string captcha_id = 3;
    string captcha_code = 4;
}

message LoginResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
    string token = 4;
    string csrf_token = 5;
}

message LogoutRequest {
    uint32 user_id = 1;
    string token = 2;
}

// ===================== 图形验证码 (防机器人) =====================

message GenerateCaptchaRequest {
    // 留空即可，未来可扩展：指定宽度/高度/长度等。
}

message GenerateCaptchaResponse {
    uint32 code = 1;
    string message = 2;
    string captcha_id = 3;   // 校验时回传
    string image_base64 = 4; // data:image/png;base64,... 可直接用于 <img src>
}

message LogoutResponse {
    uint32 code = 1;
    string message = 2;
}

message GetUserRequest {
    uint32 user_id = 1;
    string username = 2;
}

message GetUserResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    uint32 code = 1;
    string message = 2;
    uint32 user_id = 3;
    string username = 4;
    bool valid = 5;
}

message UpdateUserRequest {
    uint32 user_id = 1;
    string nickname = 2;
    string avatar = 3;
    string bio = 4;
}

message UpdateUserResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
}

message DeleteUserRequest {
    uint32 user_id = 1;
}

message DeleteUserResponse {
    uint32 code = 1;
    string message = 2;
}

message GetUsersRequest {
    uint32 page = 1;
    uint32 page_size = 2;
    uint32 role = 3;
}

message GetUsersResponse {
    uint32 code = 1;
    string message = 2;
    repeated User users = 3;
    uint32 total = 4;
}

message ChangePasswordRequest {
    uint32 user_id = 1;
    string old_password = 2;
    string new_password = 3;
}

message ChangePasswordResponse {
    uint32 code = 1;
    string message = 2;
}

message BlacklistRequest {
    uint32 user_id = 1;
    uint32 target_user_id = 2;
    string reason = 3;
}

message BlacklistResponse {
    uint32 code = 1;
    string message = 2;
}

message IsBlacklistRequest {
    uint32 user_id = 1;
    uint32 target_user_id = 2;
}

message IsBlacklistResponse {
    uint32 code = 1;
    string message = 2;
    bool in_blacklist = 3;
}

// ===================== 操作日志 (Audit) =====================

// AuditAction 操作日志动作枚举，作为各服务上报操作日志的统一取值字典。
// 新增动作只需在此追加（proto3 要求首个成员值为 0，且不可为空）。
enum AuditAction {
    AUDIT_ACTION_UNSPECIFIED = 0;
    // 用户域
    AUDIT_ACTION_UPDATE_USER = 1;   // 更新用户资料
    AUDIT_ACTION_DELETE_USER = 2;   // 删除用户
    AUDIT_ACTION_DISABLE_USER = 3;  // 禁用用户
    AUDIT_ACTION_ENABLE_USER = 4;   // 启用用户
    AUDIT_ACTION_SET_ROLE = 5;      // 修改用户角色
    // 评论域
    AUDIT_ACTION_COMMENT_CREATE = 10; // 创建评论
    AUDIT_ACTION_COMMENT_REPLY = 11;  // 回复评论
    AUDIT_ACTION_COMMENT_UPDATE = 12; // 更新评论
    AUDIT_ACTION_COMMENT_DELETE = 13; // 删除评论
    AUDIT_ACTION_COMMENT_LIKE = 14;   // 点赞评论
    AUDIT_ACTION_COMMENT_ENABLE = 15; // 开启文章评论
    AUDIT_ACTION_COMMENT_DISABLE = 16; // 关闭文章评论
    // 文章域
    AUDIT_ACTION_ARTICLE_CREATE = 20;  // 创建文章
    AUDIT_ACTION_ARTICLE_UPDATE = 21;  // 更新文章
    AUDIT_ACTION_ARTICLE_DELETE = 22;  // 删除文章
    AUDIT_ACTION_ARTICLE_PUBLISH = 23; // 发布文章
    AUDIT_ACTION_ARTICLE_OFFLINE = 24; // 下架文章
    AUDIT_ACTION_ARTICLE_APPROVE = 25; // 审核通过
    AUDIT_ACTION_ARTICLE_REJECT = 26;  // 审核拒绝
    AUDIT_ACTION_ARTICLE_SUBMIT = 27;  // 提交审核
    AUDIT_ACTION_ARTICLE_SET_CATEGORY = 28; // 设置文章分类
    // 分类域
    AUDIT_ACTION_CATEGORY_CREATE = 30; // 创建分类
    AUDIT_ACTION_CATEGORY_UPDATE = 31; // 更新分类
    AUDIT_ACTION_CATEGORY_DELETE = 32; // 删除分类
}

message OperationLog {
    uint32 id = 1;
    uint32 operator_id = 2;
    string operator = 3;
    string action = 4;
    string target_type = 5;
    uint32 target_id = 6;
    string target_title = 7;
    string detail = 8;
    string ip = 9;
    string created_at = 10;
}

message RecordLogRequest {
    uint32 operator_id = 1;
    string operator = 2;
    AuditAction action = 3;
    string target_type = 4;
    uint32 target_id = 5;
    string target_title = 6;
    string detail = 7;
    string ip = 8;
}

message RecordLogResponse {
    uint32 code = 1;
    string message = 2;
    uint32 id = 3;
}

// ===================== 后台管理 =====================

message AdminGetUsersRequest {
    uint32 page = 1;
    uint32 page_size = 2;
    uint32 role = 3;
    string keyword = 4;   // 用户名/邮箱模糊匹配
    uint32 status = 5;    // 0=全部，1=正常，2=禁用
}

message AdminGetUsersResponse {
    uint32 code = 1;
    string message = 2;
    repeated User users = 3;
    uint32 total = 4;
}

message AdminUpdateUserRequest {
    uint32 id = 1;
    string nickname = 2;  // 空字符串=不修改
    uint32 role = 3;      // 0=不修改
    uint32 status = 4;    // 0=不修改
}

message AdminUpdateUserResponse {
    uint32 code = 1;
    string message = 2;
    User user = 3;
}

message AdminDeleteUserRequest {
    uint32 id = 1;
}

// ===================== 操作日志查询 =====================

message ListOperationLogsRequest {
    uint32 page = 1;
    uint32 page_size = 2;
    string action = 3;
    string target_type = 4;
    uint32 operator_id = 5;
}

message ListOperationLogsResponse {
    uint32 code = 1;
    string message = 2;
    repeated OperationLog logs = 3;
    uint32 total = 4;
}
